[project]
name = "doc-analyzer"
version = "0.1.0"
description = "Multi-agent document analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
