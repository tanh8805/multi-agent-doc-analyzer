[project]
name = "doc-analyzer"
version = "0.1.0"
description = "Multi-agent document analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.6.12",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.16",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
